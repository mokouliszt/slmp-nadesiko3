name: Publish to npm

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # required for OIDC trusted publishing (npm auth + provenance)

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false # avoid cache poisoning risk on a trusted-publishing workflow

      - run: npm ci || npm install

      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

      - name: Verify the release tag matches package.json's version
        if: github.event_name == 'release'
        run: |
          TAG_VERSION="${{ github.event.release.tag_name }}"
          TAG_VERSION="${TAG_VERSION#v}"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Release tag ${{ github.event.release.tag_name }} does not match package.json version $PKG_VERSION"
            exit 1
          fi

      # No NODE_AUTH_TOKEN here on purpose: npm authenticates via the
      # OIDC token from `id-token: write` (Trusted Publisher on npmjs.com).
      # Setting NODE_AUTH_TOKEN — even to an empty secret — makes npm skip
      # the OIDC exchange and fail. Provenance is attached automatically.
      - run: npm publish